# Configuration Fly.io pour le serveur Capturia Office
# Deployer avec: fly deploy
# Region: yyz (Toronto)

app = 'capturia-office-server'
primary_region = 'yyz'

[build]

[env]
  PORT = '2567'
  NODE_ENV = 'production'
  DB_PATH = '/data/capturia.db'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[mounts]
  source = 'capturia_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
