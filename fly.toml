# Configuration Fly.io pour le serveur Capturia Office
# Deployer avec: fly deploy
# Region: yul (Montreal)

app = 'capturia-office-server'
primary_region = 'yul'

[build]

[env]
  PORT = '2567'
  NODE_ENV = 'production'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
