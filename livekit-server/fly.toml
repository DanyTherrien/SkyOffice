# LiveKit SFU server for Capturia Office
# Deploy with: fly deploy from this directory

app = 'capturia-livekit'
primary_region = 'yyz'

[build]
  image = 'livekit/livekit-server:latest'

[env]
  LIVEKIT_PORT = '7880'

[http_service]
  internal_port = 7880
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'udp'
  internal_port = 7882

  [[services.ports]]
    port = 7882

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
